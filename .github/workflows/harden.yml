name: Script Hardening (Cython .so)

on:
  workflow_dispatch:
  push:
    paths:
      - 'dravix.py'

permissions:
  contents: read

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel cython
          python -m pip install rich pycryptodome zstandard requests pytz gmalg

      - name: Spec-check the source first
        run: python -m py_compile dravix.py

      - name: Compile dravix.py -> C extension (.so)
        run: |
          python -m cython -3 --fast-fail -X language_level=3 dravix.py
          cat > setup_cython.py <<'EOF'
          from setuptools import setup, Extension
          setup(name="dravix", ext_modules=[Extension("dravix", ["dravix.c"])], script_args=['build_ext', '--inplace'])
          EOF
          python setup_cython.py build_ext --inplace

      - name: Strip symbols + smoke test
        run: |
          SO=$(ls dravix*.so | head -n1)
          strip --strip-unneeded "$SO"
          python -c "import dravix; print('HARDENED MODULE OK')"

      - name: AES-256 encrypt the hardened .so
        run: |
          SO=$(ls dravix*.so | head -n1)
          KEY=$(python - <<'PY'
          import secrets, base64
          print(base64.b64encode(secrets.token_bytes(32)).decode())
          PY
          )
          python - "$SO" "$KEY" <<'PY'
          import sys
          from Crypto.Cipher import AES
          from Crypto.Protocol.KDF import PBKDF2
          so, key = sys.argv[1], sys.argv[2]
          data = open(so, 'rb').read()
          derived = PBKDF2(key.encode(), b'FRIENDBGMITool2026', 32, count=10000)
          cipher = AES.new(derived, AES.MODE_EAX)
          ct, tag = cipher.encrypt_and_digest(data)
          open('dravix_hardened.so.enc', 'wb').write(cipher.nonce + tag + ct)
          PY
          printf '%s\n' "$KEY" > dravix_hardened.key

      - name: Upload hardened artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hardened-dravix
          path: |
            dravix*.so
            dravix_hardened.so.enc
            dravix_hardened.key
          if-no-files-found: error